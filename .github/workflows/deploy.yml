name: build-push-deploy

on:
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build (Gradle)
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set image tags
        id: tags
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "LATEST_TAG=prod-latest" >> $GITHUB_OUTPUT
            echo "SHA_TAG=prod-${GITHUB_SHA}" >> $GITHUB_OUTPUT
          else
            echo "LATEST_TAG=dev-latest" >> $GITHUB_OUTPUT
            echo "SHA_TAG=dev-${GITHUB_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Build & Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mnc-team/libri_backend:${{ steps.tags.outputs.LATEST_TAG }}
            ghcr.io/mnc-team/libri_backend:${{ steps.tags.outputs.SHA_TAG }}

  deploy_to_ec2:
    needs: build_and_push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/libri

            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              export APP_PROD_TAG=prod-latest
              docker compose pull app-prod
              docker compose up -d --no-deps app-prod
            else
              export APP_DEV_TAG=dev-latest
              docker compose pull app-dev
              docker compose up -d --no-deps app-dev
            fi

            docker image prune -f
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
