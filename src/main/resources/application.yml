spring:
  application:
    name: libri

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: Hikari-Libri

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  access-exp-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS}
  refresh-exp-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:1209600}
  issuer: ${JWT_ISSUER}

app:
  aladin:
    base-url: ${ALADIN_BASE_URL:http://www.aladin.co.kr}
    ttb-key: ${ALADIN_TTB_KEY:}
    version: ${ALADIN_API_VERSION:20131101}
    max-results: ${ALADIN_MAX_RESULTS:50}
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
    upload-expiration-seconds: ${AWS_S3_UPLOAD_EXPIRATION_SECONDS:300}
  social:
    kakao:
      base-url: ${KAKAO_API_BASE_URL:https://kapi.kakao.com}
      auth-base-url: ${KAKAO_AUTH_BASE_URL:https://kauth.kakao.com}
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost}
    apple:
      base-url: ${APPLE_API_BASE_URL:https://appleid.apple.com}
      issuer: ${APPLE_ISSUER:https://appleid.apple.com}
      client-ids: ${APPLE_CLIENT_IDS:}

# Firebase FCM — 키 파일: src/main/resources/libri-firebase.json
firebase:
  enabled: ${FIREBASE_ENABLED:true}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:classpath:libri-firebase.json}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost}
